<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aurea Piano – Konfigurator Fortepianu</title>

<style>

body{
margin:0;
font-family:Georgia,serif;
background:#0f0f0f;
color:white;
}

header{
padding:30px;
display:flex;
justify-content:space-between;
border-bottom:1px solid #333;
background:black;
}

.logo{
color:#d4af37;
font-size:26px;
letter-spacing:3px;
}

section{
padding:60px 10%;
}

.title{
font-size:36px;
color:#d4af37;
margin-bottom:40px;
}

.configurator{
display:grid;
grid-template-columns:1fr 1fr;
gap:60px;
align-items:center;
}

#viewer{
width:100%;
height:500px;
background:#111;
border:1px solid #333;
}

.controls label{
display:block;
margin-top:20px;
font-size:18px;
}

.controls select{
width:100%;
padding:8px;
margin-top:6px;
background:#111;
color:white;
border:1px solid #444;
}

.price{
font-size:28px;
margin-top:30px;
color:#d4af37;
}

footer{
margin-top:80px;
padding:40px;
text-align:center;
background:black;
color:#777;
}

@media(max-width:900px){

.configurator{
grid-template-columns:1fr;
}

}

</style>

</head>

<body>

<header>
<div class="logo">AUREA PIANO</div>
</header>


<section>

<h1 class="title">Konfigurator fortepianu</h1>

<div class="configurator">

<div id="viewer"></div>

<div class="controls">

<label>Kolor fortepianu</label>
<select id="color">
<option value="black">Czarny</option>
<option value="white">Biały</option>
<option value="red">Czerwony</option>
<option value="blue">Niebieski</option>
</select>

<label>Wykończenie</label>
<select id="finish">
<option value="gloss">Połysk</option>
<option value="matte">Mat</option>
</select>

<label>Kolor nóg</label>
<select id="legs">
<option value="black">Czarne</option>
<option value="gold">Złote</option>
<option value="silver">Srebrne</option>
</select>

<div class="price" id="price">
Cena: 80 000 zł
</div>

</div>

</div>

</section>


<footer>
© 2026 Aurea Piano – Luksusowe fortepiany
</footer>


<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script>

<script>

const scene = new THREE.Scene()
scene.background = new THREE.Color(0x111111)

const camera = new THREE.PerspectiveCamera(
60,
document.getElementById("viewer").clientWidth / 500,
0.1,
1000
)

const renderer = new THREE.WebGLRenderer({antialias:true})
renderer.setSize(
document.getElementById("viewer").clientWidth,
500
)

document.getElementById("viewer").appendChild(renderer.domElement)

const controls = new THREE.OrbitControls(camera,renderer.domElement)

camera.position.set(5,4,6)
controls.update()

const light = new THREE.DirectionalLight(0xffffff,1)
light.position.set(5,10,7)
scene.add(light)

scene.add(new THREE.AmbientLight(0xffffff,0.5))

/* BODY */

const bodyMaterial = new THREE.MeshStandardMaterial({color:0x000000,roughness:0.2})

const body = new THREE.Mesh(
new THREE.BoxGeometry(4,1,3),
bodyMaterial
)

scene.add(body)

/* LID */

const lid = new THREE.Mesh(
new THREE.BoxGeometry(4,0.2,3),
bodyMaterial
)

lid.position.y=0.6
scene.add(lid)

/* LEGS */

const legMaterial = new THREE.MeshStandardMaterial({color:0x000000})

const legs=[]

function createLeg(x,z){

const leg = new THREE.Mesh(
new THREE.CylinderGeometry(0.15,0.15,2),
legMaterial
)

leg.position.set(x,-1,z)
scene.add(leg)

legs.push(leg)

}

createLeg(1.8,1.2)
createLeg(-1.8,1.2)
createLeg(1.8,-1.2)
createLeg(-1.8,-1.2)

function updateConfig(){

const color = document.getElementById("color").value
const finish = document.getElementById("finish").value
const legsColor = document.getElementById("legs").value

let price = 80000

const colors={
black:0x000000,
white:0xffffff,
red:0xaa0000,
blue:0x0033aa
}

bodyMaterial.color.setHex(colors[color])

if(finish==="matte"){
bodyMaterial.roughness=0.8
}else{
bodyMaterial.roughness=0.2
price+=3000
}

const legColors={
black:0x000000,
gold:0xd4af37,
silver:0xcccccc
}

legMaterial.color.setHex(legColors[legsColor])

if(legsColor==="gold") price+=5000
if(legsColor==="silver") price+=2000

document.getElementById("price").innerText=
"Cena: "+price.toLocaleString()+" zł"

}

document.getElementById("color").onchange=updateConfig
document.getElementById("finish").onchange=updateConfig
document.getElementById("legs").onchange=updateConfig

function animate(){

requestAnimationFrame(animate)

renderer.render(scene,camera)

}

animate()

</script>

</body>
</html>
