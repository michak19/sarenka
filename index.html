<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurea Piano – Konfigurator</title>

<style>

body{
margin:0;
background:#0f0f0f;
color:white;
font-family:Georgia,serif;
}

header{
padding:30px;
background:black;
border-bottom:1px solid #333;
}

.logo{
color:#d4af37;
font-size:26px;
}

section{
padding:60px 10%;
}

.config{
display:grid;
grid-template-columns:1fr 1fr;
gap:50px;
}

#viewer{
width:100%;
height:500px;
background:#111;
border:1px solid #333;
}

select{
width:100%;
padding:8px;
margin-top:10px;
background:#111;
color:white;
border:1px solid #444;
}

.price{
font-size:26px;
margin-top:30px;
color:#d4af37;
}

</style>
</head>

<body>

<header>
<div class="logo">AUREA PIANO</div>
</header>

<section>

<h1>Konfigurator fortepianu</h1>

<div class="config">

<div id="viewer"></div>

<div>

<label>Kolor fortepianu</label>
<select id="color">
<option value="black">Czarny</option>
<option value="white">Biały</option>
<option value="red">Czerwony</option>
<option value="blue">Niebieski</option>
</select>

<label>Wykończenie</label>
<select id="finish">
<option value="gloss">Połysk</option>
<option value="matte">Mat</option>
</select>

<label>Kolor nóg</label>
<select id="legs">
<option value="black">Czarne</option>
<option value="gold">Złote</option>
<option value="silver">Srebrne</option>
</select>

<div class="price" id="price">Cena: 80 000 zł</div>

</div>

</div>

</section>

<script type="module">

import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
import { OrbitControls } from "https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js";

const container = document.getElementById("viewer")

const scene = new THREE.Scene()
scene.background = new THREE.Color(0x111111)

const camera = new THREE.PerspectiveCamera(
60,
container.clientWidth / container.clientHeight,
0.1,
1000
)

camera.position.set(6,4,6)

const renderer = new THREE.WebGLRenderer({antialias:true})
renderer.setSize(container.clientWidth,container.clientHeight)
container.appendChild(renderer.domElement)

const controls = new OrbitControls(camera,renderer.domElement)
controls.enableDamping=true

/* światło */

const light = new THREE.DirectionalLight(0xffffff,1)
light.position.set(5,10,5)
scene.add(light)

scene.add(new THREE.AmbientLight(0xffffff,0.5))

/* materiały */

const bodyMaterial = new THREE.MeshStandardMaterial({
color:0x000000,
roughness:0.2
})

const legMaterial = new THREE.MeshStandardMaterial({
color:0x000000
})

/* fortepian */

const body = new THREE.Mesh(
new THREE.BoxGeometry(4,1,3),
bodyMaterial
)

scene.add(body)

const lid = new THREE.Mesh(
new THREE.BoxGeometry(4,0.2,3),
bodyMaterial
)

lid.position.y=0.6
scene.add(lid)

/* nogi */

function createLeg(x,z){

const leg = new THREE.Mesh(
new THREE.CylinderGeometry(0.15,0.15,2),
legMaterial
)

leg.position.set(x,-1,z)
scene.add(leg)

}

createLeg(1.8,1.2)
createLeg(-1.8,1.2)
createLeg(1.8,-1.2)
createLeg(-1.8,-1.2)

/* konfigurator */

function update(){

let price = 80000

const color = document.getElementById("color").value
const finish = document.getElementById("finish").value
const legs = document.getElementById("legs").value

const colors={
black:0x000000,
white:0xffffff,
red:0xaa0000,
blue:0x0033aa
}

bodyMaterial.color.setHex(colors[color])

if(finish==="matte"){
bodyMaterial.roughness=0.8
}else{
bodyMaterial.roughness=0.2
price+=3000
}

const legColors={
black:0x000000,
gold:0xd4af37,
silver:0xcccccc
}

legMaterial.color.setHex(legColors[legs])

if(legs==="gold") price+=5000
if(legs==="silver") price+=2000

document.getElementById("price").innerText =
"Cena: "+price.toLocaleString()+" zł"

}

document.getElementById("color").onchange=update
document.getElementById("finish").onchange=update
document.getElementById("legs").onchange=update

/* animacja */

function animate(){

requestAnimationFrame(animate)

controls.update()

renderer.render(scene,camera)

}

animate()

</script>

</body>
</html>
